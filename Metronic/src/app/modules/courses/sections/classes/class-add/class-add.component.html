<div class="row">
    <div class="col-6">
        <span class="spinner-border spinner-border-sm align-middle ms-2" *ngIf="isLoading$ | async"></span>
        <div class="card card-flush h-lg-100">
            <div class="card-header pt-7">
                <div class="card-title">
                    <i class="ki-duotone ki-note-2 fs-1 me-2">
                        <span class="path1"></span>
                        <span class="path2"></span>
                        <span class="path3"></span>
                        <span class="path4"></span>
                    </i>
                    <h2>Add New Class</h2>
                </div>
            </div>
            <div class="card-body pt-5">
                <div class="row">
                    <div class="col">
                        <label class="fs-6 fw-bold form-label mt-3">
                            <span class="required">Title</span>
                        </label>
                        <input type="text" class="form-control form-control-solid" [(ngModel)]="title">
                    </div>
                </div>
                <!-- <div class="row">
                    <div class="col">
                        <label class="fs-6 fw-bold form-label mt-3">
                            <span class="required">Vimeo ID</span>
                        </label>
                        <input type="text" class="form-control form-control-solid" [(ngModel)]="vimeo_id">
                    </div>
                    <div class="col">
                        <label class="fs-6 fw-bold form-label mt-3">
                            <span class="required">Duration</span>
                        </label>
                        <input type="text" class="form-control form-control-solid" placeholder="e.g. 12:30" [(ngModel)]="time">
                    </div>
                </div> -->
                <div class="row">
                    <div class="col">
                        <label class="fs-6 fw-bold form-label mt-3">
                            <span class="required">Description</span>
                        </label>
                        <ckeditor [data]="description" (change)="onChange($event)" [config]="{ versionCheck: false }"></ckeditor>
                    </div>
                </div>
                <div class="col mt-3">
                    <button class="btn btn-primary" (click)="save()">Save</button>
                </div>
            </div>
        </div>
    </div>
    <div class="col-6">
        <div class="card card-xl-stretch mb-xl-8">
            <div class="card-header border-0 pt-5">
                <h3 class="card-title align-items-start flex-column">
                    <span class="card-label fw-bolder fs-3 mb-1">Classes</span>
                    <span class="text-muted mt-1 fw-bold fs-7">Section classes</span>
                </h3>
            </div>
            <div class="card-body py-3">
                <div class="table-responsive">
                    <table class="table align-middle gs-0 gy-3">
                        <thead>
                            <tr>
                                <th class="p-0 w-50px"></th>
                                <th class="p-0 min-w-150px">Title</th>
                                <th class="p-0 min-w-100px text-center">Duration</th>
                                <th class="p-0 min-w-100px text-center">Status</th>
                                <th class="p-0 min-w-100px text-center">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <ng-container *ngFor="let item of courseClassesList">
                                <tr>
                                    <td>
                                        <div class="symbol symbol-50px me-2">
                                            <span class="symbol-label bg-light-white">
                                                <i class="bi bi-vimeo fs-3 text-primary"></i>
                                            </span>
                                        </div>
                                    </td>
                                    <td>
                                        <span class="text-dark fw-bolder mb-1 fs-6">{{item.title}}</span>
                                    </td>
                                    <td class="text-center">
                                        <span class="text-dark fw-bolder d-block fs-7">{{item.time}}</span>
                                    </td>
                                    <td class="text-center">
                                        <span class="badge fs-7 fw-bolder"
                                          [ngClass]="item.state === 1 ? 'badge-light-success' : 'badge-light-danger'">
                                          {{ item.state === 1 ? 'Active' : 'Inactive' }}
                                        </span>
                                    </td>
                                    <td class="text-center">
                                        <a href="#" (click)="editCourseSectionClass(item)"
                                            class="btn btn-icon btn-bg-light btn-active-color-primary btn-sm me-1"
                                            onclick="return false">
                                            <span class="svg-icon svg-icon-3">
                                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
                                                    <path opacity="0.3" d="M21.4 8.35303L19.241 10.511L13.485 4.755L15.643 2.59595C16.0248 2.21423 16.5426 1.99988 17.0825 1.99988C17.6224 1.99988 18.1402 2.21423 18.522 2.59595L21.4 5.474C21.7817 5.85581 21.9962 6.37355 21.9962 6.91345C21.9962 7.45335 21.7817 7.97122 21.4 8.35303ZM3.68699 21.932L9.88699 19.865L4.13099 14.109L2.06399 20.309C1.98815 20.5354 1.97703 20.7787 2.03189 21.0111C2.08674 21.2436 2.2054 21.4561 2.37449 21.6248C2.54359 21.7934 2.75641 21.9115 2.989 21.9658C3.22158 22.0201 3.4647 22.0084 3.69099 21.932H3.68699Z" fill="currentColor"></path>
                                                    <path d="M5.574 21.3L3.692 21.928C3.46591 22.0032 3.22334 22.0141 2.99144 21.9594C2.75954 21.9046 2.54744 21.7864 2.3789 21.6179C2.21036 21.4495 2.09202 21.2375 2.03711 21.0056C1.9822 20.7737 1.99289 20.5312 2.06799 20.3051L2.696 18.422L5.574 21.3ZM4.13499 14.105L9.891 19.861L19.245 10.507L13.489 4.75098L4.13499 14.105Z" fill="currentColor"></path>
                                                </svg>
                                            </span>
                                        </a>
                                        <a href="#" (click)="deleteCourseSectionClass(item._id)"
                                            class="btn btn-icon btn-bg-light btn-active-color-primary btn-sm"
                                            onclick="return false">
                                            <span class="svg-icon svg-icon-3">
                                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
                                                    <path d="M5 9C5 8.44772 5.44772 8 6 8H18C18.5523 8 19 8.44772 19 9V18C19 19.6569 17.6569 21 16 21H8C6.34315 21 5 19.6569 5 18V9Z" fill="currentColor"></path>
                                                    <path opacity="0.5" d="M5 5C5 4.44772 5.44772 4 6 4H18C18.5523 4 19 4.44772 19 5V5C19 5.55228 18.5523 6 18 6H6C5.44772 6 5 5.55228 5 5V5Z" fill="currentColor"></path>
                                                    <path opacity="0.5" d="M9 4C9 3.44772 9.44772 3 10 3H14C14.5523 3 15 3.44772 15 4V4H9V4Z" fill="currentColor"></path>
                                                </svg>
                                            </span>
                                        </a>
                                    </td>
                                </tr>
                            </ng-container>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
