<div class="card mb-5 mb-xl-8">
    <!--begin::Header-->
    <div class="card-header border-0 pt-5">
        <h3 class="card-title align-items-start flex-column">
            <span class="card-label fw-bolder fs-3 mb-1">Courses List</span>
        </h3>
    </div>
    <!--end::Header-->
    <!--begin::Body-->
    <div class="card-body py-3">
        <!--begin::Table container-->
        <div class="table-responsive">
            <!--begin::Table-->
            <table class="table align-middle gs-0 gy-4">
                <!--begin::Table head-->
                <thead>
                    <tr class="fw-bolder text-muted bg-light">
                        <th class="ps-4 min-w-325px rounded-start">Course</th>
                        <th class="min-w-125px">Price USD</th>
                        <th class="min-w-125px">Price ARG</th>
                        <th class="min-w-200px">Instructor</th>
                        <th class="min-w-150px">Status</th>
                        <th class="min-w-200px text-end rounded-end">
                            <span class="me-5">Action</span>
                        </th>
                    </tr>
                </thead>
                <!--end::Table head-->
                <!--begin::Table body-->
                <tbody *ngIf="!(isLoading$ | async)">
                    <ng-container *ngFor="let course of coursesList">
                        <tr>
                            <td>
                                <div class="d-flex align-items-center">
                                    <div class="symbol symbol-50px me-5" *ngIf="!course.image">
                                        <img src="assets/media/stock/600x400/img-26.jpg" class=""
                                            alt="Coveri mage of a course">
                                    </div>
                                    <div class="symbol symbol-50px me-5" *ngIf="course.image">
                                        <img [src]="course.image" class="" alt="Coveri mage of a course">
                                    </div>
                                    <div class="d-flex justify-content-start flex-column">
                                        <a href="#"
                                            class="text-dark fw-bolder text-hover-primary mb-1 fs-6">{{course.title}}</a>
                                        <span
                                            class="text-muted fw-bold text-muted d-block fs-7">{{course.sub_title}}</span>
                                    </div>
                                </div>
                            </td>
                            <td>
                                <a href="#"
                                    class="text-dark fw-bolder text-hover-primary d-block mb-1 fs-6">${{course.price_usd}}</a>
                                <span class="text-muted fw-bold text-muted d-block fs-7">USD</span>
                            </td>
                            <td>
                                <a href="#"
                                    class="text-dark fw-bolder text-hover-primary d-block mb-1 fs-6">${{course.price_pesos}}</a>
                                <span class="text-muted fw-bold text-muted d-block fs-7">ARG</span>
                            </td>
                            <td>
                                <a href="#"
                                    class="text-dark fw-bolder text-hover-primary d-block mb-1 fs-6">{{course.user.name
                                    + " " + course.user.surname}}</a>
                                <span class="text-muted fw-bold text-muted d-block fs-7">Instructor</span>
                            </td>
                            <td>
                                <ng-container *ngIf="course.state == 1">
                                    <span class="badge badge-light-warning fs-7 fw-bold">Testing</span>
                                </ng-container>
                                <ng-container *ngIf="course.state == 2">
                                    <span class="badge badge-light-success fs-7 fw-bold">Active</span>
                                </ng-container>
                                <ng-container *ngIf="course.state == 3">
                                    <span class="badge badge-light-danger fs-7 fw-bold">Inactive</span>
                                </ng-container>
                            </td>
                            <td class="text-end">
                                <a href="#" [routerLink]="['/courses/list/section/', course._id]"
                                    routerLinkActive="router-link-active"
                                    class="btn btn-icon btn-bg-light btn-active-color-primary btn-sm me-1"
                                    onclick="return false">
                                    <!--begin::Svg Icon | path: icons/duotune/art/art005.svg-->
                                    <span class="svg-icon svg-icon-3">
                                        <i class="ki-duotone ki-abstract-14 fs-3 d-flex justify-content-center">
                                            <span class="path1"></span>
                                            <span class="path2"></span>
                                        </i>
                                    </span>
                                    <!--end::Svg Icon-->
                                </a>
                                <a href="#" [routerLink]="['/courses/edit/', course._id]"
                                    routerLinkActive="router-link-active"
                                    class="btn btn-icon btn-bg-light btn-active-color-primary btn-sm me-1"
                                    onclick="return false">
                                    <!--begin::Svg Icon | path: icons/duotune/art/art005.svg-->
                                    <span class="svg-icon svg-icon-3">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                                            viewBox="0 0 24 24" fill="none">
                                            <path opacity="0.3"
                                                d="M21.4 8.35303L19.241 10.511L13.485 4.755L15.643 2.59595C16.0248 2.21423 16.5426 1.99988 17.0825 1.99988C17.6224 1.99988 18.1402 2.21423 18.522 2.59595L21.4 5.474C21.7817 5.85581 21.9962 6.37355 21.9962 6.91345C21.9962 7.45335 21.7817 7.97122 21.4 8.35303ZM3.68699 21.932L9.88699 19.865L4.13099 14.109L2.06399 20.309C1.98815 20.5354 1.97703 20.7787 2.03189 21.0111C2.08674 21.2436 2.2054 21.4561 2.37449 21.6248C2.54359 21.7934 2.75641 21.9115 2.989 21.9658C3.22158 22.0201 3.4647 22.0084 3.69099 21.932H3.68699Z"
                                                fill="currentColor"></path>
                                            <path
                                                d="M5.574 21.3L3.692 21.928C3.46591 22.0032 3.22334 22.0141 2.99144 21.9594C2.75954 21.9046 2.54744 21.7864 2.3789 21.6179C2.21036 21.4495 2.09202 21.2375 2.03711 21.0056C1.9822 20.7737 1.99289 20.5312 2.06799 20.3051L2.696 18.422L5.574 21.3ZM4.13499 14.105L9.891 19.861L19.245 10.507L13.489 4.75098L4.13499 14.105Z"
                                                fill="currentColor"></path>
                                        </svg>
                                    </span>
                                    <!--end::Svg Icon-->
                                </a>
                                <a href="#" (click)="deleteCourse(course)"
                                    class="btn btn-icon btn-bg-light btn-active-color-primary btn-sm"
                                    onclick="return false">
                                    <!--begin::Svg Icon | path: icons/duotune/general/gen027.svg-->
                                    <span class="svg-icon svg-icon-3">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                                            viewBox="0 0 24 24" fill="none">
                                            <path
                                                d="M5 9C5 8.44772 5.44772 8 6 8H18C18.5523 8 19 8.44772 19 9V18C19 19.6569 17.6569 21 16 21H8C6.34315 21 5 19.6569 5 18V9Z"
                                                fill="currentColor"></path>
                                            <path opacity="0.5"
                                                d="M5 5C5 4.44772 5.44772 4 6 4H18C18.5523 4 19 4.44772 19 5V5C19 5.55228 18.5523 6 18 6H6C5.44772 6 5 5.55228 5 5V5Z"
                                                fill="currentColor"></path>
                                            <path opacity="0.5"
                                                d="M9 4C9 3.44772 9.44772 3 10 3H14C14.5523 3 15 3.44772 15 4V4H9V4Z"
                                                fill="currentColor"></path>
                                        </svg>
                                    </span>
                                    <!--end::Svg Icon-->
                                </a>
                            </td>
                        </tr>
                    </ng-container>
                </tbody>
                <!--end::Table body-->
            </table>
            <!--end::Table-->
        </div>
        <!--end::Table container-->
    </div>
    <!--begin::Body-->
</div>
